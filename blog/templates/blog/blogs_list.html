{% extends "catalog/home.html" %}

{% block title %}Список статей{% endblock %}

{% block content %}
{% include 'catalog/header.html' %}
<h2>Список статей</h2>
<ul class="list-group">
    {% for blog in blog_posts %}
        <li class="list-group-item">
            <a href="{% url 'blog:blog_detail' blog.pk %}">{{ blog.title }}</a> - {{ blog.content }}
        </li>
    {% endfor %}
</ul>
{% endblock %}
