<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обзор продукта</title>
    <!-- Подключение Bootstrap CSS -->
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">{{ product_name }}</h1>
        <p>Описание: {{ product_description }}</p>
        <p>Категория: {{ product_category }}</p>
        <p>Цена: {{ product_price }}</p>
        <p>Дата создания: {{ product_created_at|date:"d M Y" }}</p>
        <p>Дата изменения: {{ product_updated_at|date:"d M Y" }}</p>
    </div>
    <!-- Подключение Bootstrap JS -->
    <script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
