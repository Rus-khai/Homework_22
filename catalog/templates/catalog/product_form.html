{% extends "catalog/home.html" %}


{% block content %}

{% include 'catalog/header.html' %}
<div class="pricing-header px-3 py-3 pt-md-0 pb-md-3 mx-auto text-center">
    <h3 class="display-4">Добавление продукта</h3>
</div>
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'catalog:catalog_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
